<p>Нотификации:</p>
<label>Изтичащи скоро протоли:</label>
<ul>
    <li *ngFor="let protocol of protocolsIn7Days">
        Протокол за {{protocol.medicines.join(',')}} изтича на {{protocol.validTo}}
    </li>
</ul>
<label>Изтичащи скоро рецепти:</label>
<ul>
    <li *ngFor="let recipe of prescriptionsIn7Days">
        Рецепта за {{recipe.medicineName}} изтича на {{recipe.validTo}}
    </li>
</ul>
