<div>
  
  <mat-card>
    <mat-card-title>Влизане в приложението</mat-card-title>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="login()">

        <mat-form-field>
          <input type="email" matInput placeholder="Имейл" formControlName="email"  autocomplete="on">
          <!-- Here we can display error messages/hints for the user, if one of the Validators adds an error to the email 
           with the .touched check we only display the hints if the input was touched by the users -->
          <mat-error *ngIf="this.loginForm.get('email')?.touched && this.loginForm.get('email')?.hasError('required')">
            Имейлът е задължителен</mat-error>
          <mat-error *ngIf="this.loginForm.get('email')?.touched && this.loginForm.get('email')?.hasError('email')">
            Имейлът е невалиден</mat-error>
        </mat-form-field>

        <mat-form-field>
          <input type="password" matInput placeholder="Парола" formControlName="password"  autocomplete="off">
          <mat-error
            *ngIf="this.loginForm.get('password')?.touched && this.loginForm.get('password')?.hasError('required')">
            Паролата е задължителна</mat-error>
        </mat-form-field>

        <div class="button">
          <button type="submit" mat-button [disabled]="!loginForm.valid">Влизане</button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
