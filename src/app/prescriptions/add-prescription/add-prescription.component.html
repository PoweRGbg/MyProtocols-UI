<div class="add-prescription">
    <div>Нова рецепта:</div>
    <form (ngSubmit)="addPrescription()">
        <table>
            <tr>
                <td>
                    <mat-form-field>
                        <mat-label>Лекарство:</mat-label>
                        <input matInput id="prescriptionName" name="prescriptionName" [(ngModel)]="prescriptionName">
                    </mat-form-field>
                </td>
            </tr>
            <tr>
                <td>
                    <mat-form-field>
                        <mat-label>Валидност:</mat-label>
                        <input 
                            matInput
                            id="prescriptionValidity"
                            name="prescriptionValidity"
                            [(ngModel)]="prescriptionValidity">
                    </mat-form-field>
                </td>
            </tr>
            <tr>
                <td>
                    <mat-form-field>
                        <mat-label for="prescriptionStart">Дата на издаване:</mat-label>
                        <input matInput [matDatepicker]="picker" [(ngModel)]="prescriptionStart" name="prescription-start">
                        <mat-hint>ДД/ММ/ГГГГ</mat-hint>
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                      </mat-form-field>
                    <button mat-flat-button color="primary" type="submit">Добави</button>
                </td>
            </tr>
        </table>
    </form>
</div>
